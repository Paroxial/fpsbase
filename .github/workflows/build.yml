name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows
    # Mono builds for Windows cross-compile on Linux, which is faster and cheaper than a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: FpsBase

      - uses: actions/upload-artifact@v7
        with:
          name: FpsBase-Windows
          path: |
            build/StandaloneWindows64
            !build/StandaloneWindows64/*_DoNotShip/**
            !build/StandaloneWindows64/*_ButDontShipItWithYourGame/**
